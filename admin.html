<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - NovelFire</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><a href="index.html">NovelFire Admin</a></h1>
    </header>

    <div class="container">
        <div class="admin-card">
            <h2 id="form-title"><i class="fas fa-plus-circle"></i> Tambah Novel Baru</h2>
            <form id="add-novel-form">
                <input type="hidden" id="adm-id">
                <div class="admin-form-group">
                    <label>Judul Novel</label>
                    <input type="text" id="adm-title" required>
                </div>
                <div class="admin-form-group">
                    <label>Kategori</label>
                    <select id="adm-category">
                        <option value="Korea">Korea</option>
                        <option value="China">China</option>
                        <option value="Jepang">Jepang</option>
                    </select>
                </div>
                <div class="admin-form-group">
                    <label>Genre (Pisahkan dengan koma)</label>
                    <input type="text" id="adm-genre" placeholder="Fantasy, Action">
                </div>
                <div class="admin-form-group">
                    <label>URL Gambar Cover</label>
                    <input type="text" id="adm-image" value="https://via.placeholder.com/150x200">
                </div>
                <div class="admin-form-group">
                    <label>Sinopsis</label>
                    <textarea id="adm-desc" rows="4"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="btn-admin btn-success">Simpan ke Database Lokal</button>
                <button type="button" id="cancel-btn" class="btn-admin" style="display:none; background:#95a5a6;" onclick="resetForm()">Batal</button>
            </form>
        </div>

        <!-- Chapter Manager Section -->
        <div id="chapter-manager-card" class="admin-card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="chapter-mgr-title">Kelola Bab</h2>
                <button onclick="closeChapterManager()" class="btn-admin btn-danger">Tutup</button>
            </div>
            <hr>
            <form id="chapter-form">
                <input type="hidden" id="ch-id">
                <div class="admin-form-group">
                    <label>Judul Bab</label>
                    <input type="text" id="ch-title" required placeholder="Contoh: Bab 5: Pertemuan Tak Terduga">
                </div>
                <div class="admin-form-group">
                    <label>Konten Bab</label>
                    <textarea id="ch-content" rows="10" required placeholder="Tuliskan isi cerita di sini..."></textarea>
                </div>
                <button type="submit" id="ch-submit-btn" class="btn-admin btn-success">Tambah Bab</button>
            </form>
            <div id="chapter-admin-list" class="chapter-admin-list"></div>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-tasks"></i> Kelola Novel Kustom</h2>
            <div id="custom-novels-list">
                <!-- Tabel novel kustom akan dimuat di sini -->
            </div>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-comments"></i> Moderasi Komentar</h2>
            <p>Lihat dan hapus komentar dari seluruh novel di sini.</p>
            <div class="admin-form-group" style="margin-bottom: 20px;">
                <label for="comment-filter">Filter Komentar (Nama User / Isi Komentar)</label>
                <input type="text" id="comment-filter" placeholder="Cari komentar...">
            </div>
            <div id="comment-moderation-list" style="margin-top: 15px;">
                <!-- Daftar semua komentar akan dimuat di sini -->
            </div>
            <div id="comment-pagination" class="pagination"></div>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-user-slash"></i> Manajemen Banned User</h2>
            <div class="admin-form-group">
                <label>Ban Nama User Baru</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="ban-name-input" placeholder="Masukkan nama user...">
                    <button onclick="addNewBan()" class="btn-admin btn-danger">Ban!</button>
                </div>
            </div>
            <div id="banned-users-list" style="margin-top: 15px;">
                <!-- Daftar user yang di-ban -->
            </div>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-database"></i> Backup & Sinkronisasi</h2>
            <p>Gunakan fitur ini untuk memindahkan data (novel baru, komentar, riwayat) antar perangkat.</p>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="exportAllData()" class="btn-admin"><i class="fas fa-download"></i> Export Semua Data (JSON)</button>
                <input type="file" id="import-file" style="display: none;" onchange="handleImport(this)">
                <button onclick="document.getElementById('import-file').click()" class="btn-admin"><i class="fas fa-upload"></i> Import Data</button>
            </div>
            <button onclick="if(confirm('Hapus SEMUA data?')){localStorage.clear(); location.reload();}" class="btn-admin btn-danger" style="margin-top: 10px;">
                <i class="fas fa-trash-alt"></i> Reset Seluruh Website
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Proteksi login sederhana
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            const pass = prompt('Masukkan Password Admin:');
            if (pass === 'admin123') {
                localStorage.setItem('admin_logged_in', 'true');
            } else {
                alert('Akses Ditolak');
                location.href = 'index.html';
            }
        }

        const form = document.getElementById('add-novel-form');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');

        let currentCommentPage = 1;
        const commentsPerPage = 10;

        function renderCustomNovels() {
            const listContainer = document.getElementById('custom-novels-list');
            const custom = JSON.parse(localStorage.getItem('custom_novels')) || [];
            
            if (custom.length === 0) {
                listContainer.innerHTML = '<p>Belum ada novel kustom yang ditambahkan.</p>';
                return;
            }

            let html = `
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Judul</th>
                            <th>Kategori</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            custom.forEach(n => {
                html += `
                    <tr>
                        <td>${n.title}</td>
                        <td>${n.category}</td>
                        <td class="admin-actions">
                            <button onclick="editNovel(${n.id})" class="btn-admin btn-success" style="padding: 5px 10px;"><i class="fas fa-edit"></i></button>
                            <button onclick="openChapterManager(${n.id})" class="btn-admin" style="padding: 5px 10px; background: #3498db;" title="Kelola Bab"><i class="fas fa-book"></i></button>
                            <button onclick="deleteNovel(${n.id})" class="btn-admin btn-danger" style="padding: 5px 10px;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            listContainer.innerHTML = html;
        }

        function renderCommentModeration(filterTerm = '') {
            const container = document.getElementById('comment-moderation-list');
            const paginationContainer = document.getElementById('comment-pagination');
            if (!container) return;

            let allComments = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('comments_')) {
                    const parts = key.split('_');
                    const novelId = parseInt(parts[1]);
                    const chapterId = parseInt(parts[2]);
                    const novel = novels.find(n => n.id === novelId);
                    const chapter = novel ? novel.chapters.find(c => c.id === chapterId) : null;
                    const comments = JSON.parse(localStorage.getItem(key)) || [];

                    comments.forEach(c => {
                        allComments.push({
                            novelTitle: novel ? novel.title : 'Novel Terhapus',
                            chapterTitle: chapter ? chapter.title : `Bab ${chapterId}`,
                            storageKey: key,
                            ...c
                        });
                    });
                }
            }

            if (filterTerm) {
                const term = filterTerm.toLowerCase();
                allComments = allComments.filter(c => 
                    c.name.toLowerCase().includes(term) || c.text.toLowerCase().includes(term)
                );
            }

            allComments.sort((a, b) => b.id - a.id);

            // Logika Paginasi
            const totalPages = Math.ceil(allComments.length / commentsPerPage);
            if (currentCommentPage > totalPages) currentCommentPage = Math.max(1, totalPages);
            
            const start = (currentCommentPage - 1) * commentsPerPage;
            const paginatedComments = allComments.slice(start, start + commentsPerPage);

            if (paginatedComments.length === 0) {
                container.innerHTML = '<p>Tidak ada komentar ditemukan.</p>';
                paginationContainer.innerHTML = '';
                return;
            }

            let html = `<table class="admin-table"><thead><tr><th>Novel / Bab</th><th>User</th><th>Komentar</th><th>Aksi</th></tr></thead><tbody>`;
            paginatedComments.forEach(c => {
                html += `
                    <tr>
                        <td><small>${c.novelTitle}</small><br><strong>${c.chapterTitle}</strong></td>
                        <td><strong>${c.name}</strong><br><small>${c.date}</small></td>
                        <td>${c.text}</td>
                        <td><button onclick="deleteCommentAdmin('${c.storageKey}', ${c.id})" class="btn-admin btn-danger">Hapus</button></td>
                    </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            renderPaginationControls(totalPages, filterTerm);
        }

        function renderPaginationControls(totalPages, filterTerm) {
            const container = document.getElementById('comment-pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="btn-page ${i === currentCommentPage ? 'active' : ''}" onclick="changePage(${i}, '${filterTerm}')">${i}</button>`;
            }
            container.innerHTML = html;
        }

        window.changePage = function(page, filterTerm) {
            currentCommentPage = page;
            renderCommentModeration(filterTerm);
            window.scrollTo({ top: document.getElementById('comment-moderation-list').offsetTop - 100, behavior: 'smooth' });
        }

        window.deleteCommentAdmin = function(storageKey, commentId) {
            if (confirm('Hapus komentar ini?')) {
                let comments = JSON.parse(localStorage.getItem(storageKey)) || [];
                comments = comments.filter(c => c.id !== commentId);
                if (comments.length === 0) localStorage.removeItem(storageKey);
                else localStorage.setItem(storageKey, JSON.stringify(comments));
                renderCommentModeration(document.getElementById('comment-filter').value);
            }
        }

        window.editNovel = function(id) {
            const custom = JSON.parse(localStorage.getItem('custom_novels')) || [];
            const novel = custom.find(n => n.id === id);
            if (!novel) return;

            document.getElementById('adm-id').value = novel.id;
            document.getElementById('adm-title').value = novel.title;
            document.getElementById('adm-category').value = novel.category;
            document.getElementById('adm-genre').value = novel.genre;
            document.getElementById('adm-image').value = novel.image;
            document.getElementById('adm-desc').value = novel.description;

            formTitle.innerHTML = '<i class="fas fa-edit"></i> Edit Novel';
            submitBtn.textContent = 'Perbarui Novel';
            cancelBtn.style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.deleteNovel = function(id) {
            if (confirm('Hapus novel ini secara permanen?')) {
                let custom = JSON.parse(localStorage.getItem('custom_novels')) || [];
                custom = custom.filter(n => n.id !== id);
                localStorage.setItem('custom_novels', JSON.stringify(custom));
                renderCustomNovels();
            }
        }

        window.resetForm = function() {
            form.reset();
            document.getElementById('adm-id').value = '';
            formTitle.innerHTML = '<i class="fas fa-plus-circle"></i> Tambah Novel Baru';
            submitBtn.textContent = 'Simpan ke Database Lokal';
            cancelBtn.style.display = 'none';
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('adm-id').value;
            const custom = JSON.parse(localStorage.getItem('custom_novels')) || [];
            
            const novelData = {
                title: document.getElementById('adm-title').value,
                category: document.getElementById('adm-category').value,
                genre: document.getElementById('adm-genre').value,
                image: document.getElementById('adm-image').value,
                description: document.getElementById('adm-desc').value
            };

            if (id) {
                const index = custom.findIndex(n => n.id === parseInt(id));
                if (index !== -1) {
                    custom[index] = { ...custom[index], ...novelData };
                    alert('Novel berhasil diperbarui!');
                }
            } else {
                const newNovel = {
                    id: getNextNovelId(),
                    ...novelData,
                    chapters: [{ id: 1, title: "Bab 1: Awal Perjalanan", content: "Teks konten bab pertama novel baru Anda..." }]
                };
                custom.push(newNovel);
                alert('Novel berhasil ditambahkan!');
            }

            localStorage.setItem('custom_novels', JSON.stringify(custom));
            resetForm();
            renderCustomNovels();
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderCustomNovels();
            renderCommentModeration(); // Panggil pertama kali tanpa filter
            renderBannedUsers();

            // Event listener untuk filter komentar
            document.getElementById('comment-filter').addEventListener('input', (e) => {
                currentCommentPage = 1; // Reset ke halaman 1 saat mencari
                renderCommentModeration(e.target.value);
            });
        });

        // --- LOGIKA BANNED USER ---
        function renderBannedUsers() {
            const container = document.getElementById('banned-users-list');
            const banned = JSON.parse(localStorage.getItem('banned_users')) || [];
            
            if (banned.length === 0) {
                container.innerHTML = '<p>Tidak ada user yang diblokir.</p>';
                return;
            }

            let html = '<ul style="list-style: none; padding: 0;">';
            banned.forEach(name => {
                html += `
                    <li style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--light-bg); border: 1px solid #ddd; margin-bottom: 5px; border-radius: 4px;">
                        <span>${name}</span>
                        <button onclick="unbanUser('${name}')" class="btn-admin btn-success" style="padding: 5px 10px; font-size: 0.8rem;">Lepas Ban</button>
                    </li>
                `;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        window.banUser = function(name) {
            if (confirm(`Apakah Anda yakin ingin memblokir user "${name}"?`)) {
                let banned = JSON.parse(localStorage.getItem('banned_users')) || [];
                if (!banned.includes(name)) {
                    banned.push(name);
                    localStorage.setItem('banned_users', JSON.stringify(banned));
                    renderBannedUsers();
                }
            }
        }

        window.unbanUser = function(name) {
            let banned = JSON.parse(localStorage.getItem('banned_users')) || [];
            banned = banned.filter(n => n !== name);
            localStorage.setItem('banned_users', JSON.stringify(banned));
            renderBannedUsers();
        }

        window.addNewBan = function() {
            const input = document.getElementById('ban-name-input');
            const name = input.value.trim();
            if (name) {
                let banned = JSON.parse(localStorage.getItem('banned_users')) || [];
                if (!banned.includes(name)) {
                    banned.push(name);
                    localStorage.setItem('banned_users', JSON.stringify(banned));
                    input.value = '';
                    renderBannedUsers();
                } else {
                    alert('User sudah ada di daftar ban.');
                }
            }
        }

        function handleImport(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => importData(e.target.result);
            reader.readAsText(file);
        }
    </script>
</body>
</html>
