<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8491d" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="reading-page">
    <div class="progress-container">
        <div class="progress-bar" id="reading-progress"></div>
    </div>

    <header>
        <h1><a href="/">Novel<span>Fire</span></a></h1>
    </header>

    <nav id="main-nav">
        <div class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i> Menu</div>
        <div class="nav-links-container display-contents">
            <a href="/" class="nav-link" data-category="all"><i class="fas fa-home"></i> Home</a>
            <a href="#" class="nav-link" data-category="China"><i class="fas fa-scroll"></i> China</a>

                <i class="fas fa-moon"></i>

        </div>

    <div class="container">

            <p style="text-align: center;">Menyiapkan teks cerita...</p>

        <div class="social-links">

        </div>
        <p><a href="admin" style="color: #888; text-decoration: none; font-size: 0.8rem;"><i class="fas fa-user-shield"></i> Admin Dashboard</a></p>
    </footer>
