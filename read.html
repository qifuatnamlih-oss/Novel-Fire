<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8491d" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://www.gstatic.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net https://*.google.com https://*.googleapis.com https://*.gstatic.com https://placehold.co; frame-src 'self' https://*.google.com;">
    <title>Membaca Novel - NovelFire</title>
    <link rel="manifest" href="manifest.json">

    <!-- Performance: Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body class="reading-page">
    <div class="progress-container">
        <div class="progress-bar" id="reading-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Reading progress"></div>
    </div>

    <header class="text-center p-15">
        <h1><a href="/" title="Kembali ke Beranda">Novel<span>Fire</span></a></h1>
    </header>

    <nav id="main-nav">
        <div class="menu-toggle" id="menu-toggle" role="button" aria-label="Buka Menu"><i class="fas fa-bars"></i> Menu</div>
        <div class="nav-links-container display-contents">
            <a href="/" class="nav-link" data-category="all">All</a>
            <a href="/" class="nav-link" data-category="China">China</a>
            <a href="/" class="nav-link" data-category="Jepang">Jepang</a>
            <a href="/" class="nav-link" data-category="Fanfiction">Fanfiction</a>
            <div id="google_translate_element" class="nav-translate"></div>
            <button id="dark-mode-toggle" class="nav-dark-mode" title="Ganti Tema" aria-label="Ganti Tema Gelap/Terang">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        <div id="read-container" class="read-container">
            <!-- Konten bacaan diisi oleh JavaScript -->
            <p style="text-align: center;">Menyiapkan teks cerita...</p>
        </div>
        <div id="reader-nav" class="read-navigation"></div>
    </div>

    <footer>
        <p>NovelFire &copy; 2026 - Platform Baca Novel Terlengkap</p>
        <div class="social-links">
            <a href="#" id="footer-fb" class="social-icon" title="Facebook" aria-label="Facebook" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i></a>
            <a href="#" id="footer-tw" class="social-icon" title="Twitter" aria-label="Twitter" target="_blank" rel="noopener noreferrer"><i class="fab fa-twitter"></i></a>
            <a href="#" id="footer-ig" class="social-icon" title="Instagram" aria-label="Instagram" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
            <a href="#" id="footer-ds" class="social-icon" title="Discord" aria-label="Discord" target="_blank" rel="noopener noreferrer"><i class="fab fa-discord"></i></a>
        </div>
        <div class="site-stats">
            <span><i class="fas fa-eye"></i> Total Kunjungan: <strong id="visit-count">0</strong></span>
            <span><i class="fas fa-users"></i> Pengunjung: <strong id="visitor-count">0</strong></span>
        </div>
        <p><a href="admin" class="text-muted no-decoration text-small"><i class="fas fa-user-shield"></i> Admin Dashboard</a></p>
    </footer>

    <button id="back-to-top" class="back-to-top" type="button" title="Kembali ke Atas" aria-label="Kembali ke Atas"><i class="fas fa-chevron-up"></i></button>

    <script type="text/javascript">
        window.googleTranslateElementInit = function() {
            new google.translate.TranslateElement({
                pageLanguage: 'id',
                includedLanguages: 'en,zh-CN,ja,id',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script src="js/script.js" type="module"></script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
</body>
</html>
